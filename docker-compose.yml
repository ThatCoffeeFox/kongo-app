services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: kongo
      POSTGRES_USER: kongo
      POSTGRES_PASSWORD: kongo-local-dev
    ports: ["54329:5432"]
    volumes: ["kongo_pgdata:/var/lib/postgresql/data", "./packages/db/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kongo -d kongo"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  kongo_pgdata:
